[tool.poetry]
name = "agent-planner"
version = "0.1.0"
description = "Independent phase monitoring for agent actions"
authors = ["AgentPlanner"]
packages = [{include = "plan_monitor"}]

[tool.poetry.dependencies]
python = "^3.9"
bashlex = "^0.18"
pyyaml = "^6.0"
networkx = "^2.8"
pygraphviz = "^1.10"
datasets = "^3.2.0"
seaborn = "^0.13.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
black = "^23.0"
mypy = "^1.0"

[tool.poetry.scripts]
plan-monitor-sim = "plan_monitor.simulator.run_simulator:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
